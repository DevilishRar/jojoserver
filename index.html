<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoJo Server Builder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 2rem; color: #fff; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
    .status { text-align: center; padding: 8px 16px; border-radius: 6px; background: #1a1a2e; color: #3498db; margin-bottom: 30px; font-size: 0.9rem; }
    .card { background: #12121a; border: 1px solid #1e1e2e; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
    .card h2 { font-size: 1rem; color: #fff; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #1e1e2e; }
    .hint { color: #888; font-size: 0.85rem; margin-bottom: 12px; }
    .input-row { display: flex; gap: 8px; }
    .input-row input { flex: 1; background: #1a1a2e; border: 1px solid #2a2a3e; color: #e0e0e0; padding: 10px 14px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; outline: none; }
    .input-row input:focus { border-color: #9b59b6; }
    button { background: #9b59b6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: monospace; font-size: 0.9rem; font-weight: bold; white-space: nowrap; }
    button:hover { background: #8e44ad; }
    button:disabled { background: #555; cursor: not-allowed; }
    .btn-validate { background: #3498db; }
    .btn-validate:hover { background: #2980b9; }
    .btn-green { background: #27ae60; }
    .btn-green:hover { background: #219a52; }
    #log { background: #0d0d1a; border-radius: 6px; padding: 12px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; line-height: 1.6; color: #ccc; white-space: pre-wrap; }
    textarea { width: 100%; height: 200px; background: #0d0d1a; border: 1px solid #2a2a3e; color: #e0e0e0; font-family: monospace; font-size: 0.8rem; padding: 12px; border-radius: 6px; resize: vertical; outline: none; margin-bottom: 12px; }
    textarea:focus { border-color: #9b59b6; }
    .btn-row { display: flex; gap: 8px; }
    .btn-copy { background: #27ae60; }
    .btn-copy:hover { background: #219a52; }
    .log-ok { color: #2ecc71; }
    .log-err { color: #e74c3c; }
    .log-info { color: #3498db; }
    .footer { text-align: center; color: #555; font-size: 0.8rem; margin-top: 30px; }
    .validated-info { display: flex; align-items: center; gap: 12px; background: #0d1a0d; border: 1px solid #2ecc71; border-radius: 6px; padding: 12px; margin-top: 12px; }
    .validated-info img { width: 48px; height: 48px; border-radius: 50%; }
    .validated-info .name { color: #2ecc71; font-weight: bold; font-size: 1rem; }
    .validated-info .count { color: #888; font-size: 0.85rem; }
    .btn-row-main { display: none; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JoJo's Bizarre Adventure</h1>
    <p class="subtitle">Discord Server Builder</p>
    <div class="status" id="status">Ready</div>

    <div class="card">
      <h2>Server ID</h2>
      <p class="hint">Enter the Discord server ID to build on.</p>
      <div class="input-row">
        <input type="text" id="guildId" placeholder="e.g. 1539404742055166045" autocomplete="off">
        <button class="btn-validate" id="validateBtn" onclick="validateServer()">Validate Server ID</button>
      </div>
      <div id="validatedBox"></div>
    </div>

    <div class="card" id="actionsCard">
      <h2>Actions</h2>
      <p class="hint">Build creates channels & roles. Send pushes all embeds to the server.</p>
      <div class="btn-row-main" id="actionsBtns">
        <button id="buildBtn" onclick="startBuild()">Build Server</button>
        <button class="btn-green" id="sendBtn" onclick="sendMessages()">Send All Messages</button>
      </div>
    </div>

    <div class="card" id="logCard" style="display:none;">
      <h2>Log</h2>
      <div id="log"></div>
    </div>

    <div class="card" id="envCard" style="display:none;">
      <h2>Environment Variables</h2>
      <p class="hint">Copy these into Vercel env vars, then redeploy the bot</p>
      <textarea id="envOutput" readonly></textarea>
      <div class="btn-row">
        <button class="btn-copy" onclick="copyEnv()">Copy to Clipboard</button>
      </div>
    </div>

    <div class="footer">JoJo Server Builder v1.0</div>
  </div>

  <script>
    var envData = '';
    var guildValidated = false;

    function log(msg, cls) {
      var el = document.getElementById('log');
      var s = document.createElement('span');
      s.className = cls || '';
      s.textContent = msg + '\n';
      el.appendChild(s);
      el.scrollTop = el.scrollHeight;
    }

    function setStatus(msg, color) {
      var s = document.getElementById('status');
      s.textContent = msg;
      s.style.color = color || '#3498db';
    }

    function showLogCard() {
      var lc = document.getElementById('logCard');
      lc.style.display = '';
      document.getElementById('log').innerHTML = '';
    }

    async function validateServer() {
      var guildId = document.getElementById('guildId').value.trim();
      if (!guildId) { alert('Enter a server ID'); return; }

      var btn = document.getElementById('validateBtn');
      btn.disabled = true;
      btn.textContent = 'Validating...';
      setStatus('Checking server...', '#e67e22');

      try {
        var resp = await fetch('https://architect-henna-eta.vercel.app/api/jojo-validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ guild_id: guildId, secret: 'jojo-validate-2026' })
        });

        var data = await resp.json();

        if (!data.valid) {
          document.getElementById('validatedBox').innerHTML = '';
          setStatus(data.error || 'Invalid server', '#e74c3c');
          document.getElementById('actionsBtns').style.display = 'none';
          guildValidated = false;
          btn.disabled = false;
          btn.textContent = 'Validate Server ID';
          return;
        }

        guildValidated = true;
        var iconHtml = data.icon
          ? '<img src="' + data.icon + '" alt="icon">'
          : '<div style="width:48px;height:48px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">' + data.name.charAt(0) + '</div>';

        document.getElementById('validatedBox').innerHTML =
          '<div class="validated-info">' + iconHtml +
          '<div><div class="name">' + data.name + '</div>' +
          '<div class="count">' + (data.member_count || '?') + ' members</div></div></div>';

        document.getElementById('actionsBtns').style.display = 'flex';
        setStatus('Server validated — ready to build or send', '#2ecc71');
        btn.disabled = false;
        btn.textContent = 'Validate Server ID';

      } catch (e) {
        document.getElementById('validatedBox').innerHTML = '';
        setStatus('Validation failed: ' + e.message, '#e74c3c');
        document.getElementById('actionsBtns').style.display = 'none';
        guildValidated = false;
        btn.disabled = false;
        btn.textContent = 'Validate Server ID';
      }
    }

    async function startBuild() {
      if (!guildValidated) { alert('Validate the server first'); return; }

      var guildId = document.getElementById('guildId').value.trim();
      var btn = document.getElementById('buildBtn');
      btn.disabled = true;
      btn.textContent = 'Building...';
      setStatus('Building server...', '#e67e22');

      showLogCard();
      var allRoles = {};
      var allChannels = {};
      var botUserId = null;

      function mergeRoles(partial) { for (var k in partial) allRoles[k] = partial[k]; }
      function buildBody(extra) { var b = { guild_id: guildId, secret: 'jojo-build-2026' }; for (var k in extra) b[k] = extra[k]; return JSON.stringify(b); }

      try {
        // Phase 1: Cleanup
        log('Phase 1: Cleaning up...', 'log-info'); setStatus('Phase 1: Cleaning up...', '#e67e22');
        var r1 = await fetch('https://architect-henna-eta.vercel.app/api/jojo-builder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: buildBody({ phase: 1 }) });
        var d1 = await r1.json();
        if (!r1.ok || d1.error) { log('ERROR: ' + (d1.error || r1.status), 'log-err'); if (d1.log) d1.log.forEach(function(l) { log('  ' + l, 'log-err'); }); setStatus('Build failed', '#e74c3c'); btn.disabled = false; btn.textContent = 'Build Server'; return; }
        if (d1.log) d1.log.forEach(function(l) { log(l, 'log-ok'); });

        // Phase 2: Create roles in chunks
        var totalRoles = 187;
        var perSub = 10;
        var numChunks = Math.ceil(totalRoles / perSub);
        for (var sub = 0; sub < numChunks; sub++) {
          log('Phase 2.' + sub + ': Creating roles chunk ' + (sub + 1) + '/' + numChunks + '...', 'log-info'); setStatus('Phase 2: Creating roles (' + (sub + 1) + '/' + numChunks + ')...', '#e67e22');
          var r2 = await fetch('https://architect-henna-eta.vercel.app/api/jojo-builder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: buildBody({ phase: 2, sub: sub }) });
          var d2 = await r2.json();
          if (!r2.ok || d2.error) { log('ERROR: ' + (d2.error || r2.status), 'log-err'); if (d2.log) d2.log.forEach(function(l) { log('  ' + l, 'log-err'); }); setStatus('Build failed at roles chunk ' + (sub + 1), '#e74c3c'); btn.disabled = false; btn.textContent = 'Build Server'; return; }
          if (d2.log) d2.log.forEach(function(l) { log(l, 'log-ok'); });
          mergeRoles(d2.roles || {});
        }

        // Phase 20: Order roles
        log('Phase 2: Ordering roles...', 'log-info'); setStatus('Phase 2: Ordering roles...', '#e67e22');
        var r20 = await fetch('https://architect-henna-eta.vercel.app/api/jojo-builder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: buildBody({ phase: 20, roles: allRoles }) });
        var d20 = await r20.json();
        if (!r20.ok || d20.error) { log('ERROR: ' + (d20.error || r20.status), 'log-err'); setStatus('Build failed ordering roles', '#e74c3c'); btn.disabled = false; btn.textContent = 'Build Server'; return; }
        if (d20.log) d20.log.forEach(function(l) { log(l, 'log-ok'); });
        botUserId = d20.botUserId;

        // Phase 3: Create channels
        log('Phase 3: Creating channels...', 'log-info'); setStatus('Phase 3: Creating channels...', '#e67e22');
        var r3 = await fetch('https://architect-henna-eta.vercel.app/api/jojo-builder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: buildBody({ phase: 3, roles: allRoles, botUserId: botUserId }) });
        var d3 = await r3.json();
        if (!r3.ok || d3.error) { log('ERROR: ' + (d3.error || r3.status), 'log-err'); if (d3.log) d3.log.forEach(function(l) { log('  ' + l, 'log-err'); }); setStatus('Build failed at channels', '#e74c3c'); btn.disabled = false; btn.textContent = 'Build Server'; return; }
        if (d3.log) d3.log.forEach(function(l) { log(l, 'log-ok'); });
        allChannels = d3.channels || {};

        // Phase 4: Register commands
        log('Phase 4: Registering commands...', 'log-info'); setStatus('Phase 4: Finalizing...', '#e67e22');
        var r4 = await fetch('https://architect-henna-eta.vercel.app/api/jojo-builder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: buildBody({ phase: 4, roles: allRoles, channels: allChannels }) });
        var d4 = await r4.json();
        if (!r4.ok || d4.error) { log('ERROR: ' + (d4.error || r4.status), 'log-err'); if (d4.log) d4.log.forEach(function(l) { log('  ' + l, 'log-err'); }); setStatus('Build failed at commands', '#e74c3c'); btn.disabled = false; btn.textContent = 'Build Server'; return; }
        if (d4.log) d4.log.forEach(function(l) { log(l, 'log-ok'); });

        // Phase 5: Fix permissions
        log('Phase 5: Fixing bot permissions...', 'log-info'); setStatus('Phase 5: Fixing permissions...', '#e67e22');
        var r5 = await fetch('https://architect-henna-eta.vercel.app/api/jojo-builder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: buildBody({ phase: 5 }) });
        var d5 = await r5.json();
        if (!r5.ok || d5.error) { log('ERROR: ' + (d5.error || r5.status), 'log-err'); if (d5.log) d5.log.forEach(function(l) { log('  ' + l, 'log-err'); }); setStatus('Build failed at permissions', '#e74c3c'); btn.disabled = false; btn.textContent = 'Build Server'; return; }
        if (d5.log) d5.log.forEach(function(l) { log(l, 'log-ok'); });

        if (d4.env) {
          envData = d4.env;
          document.getElementById('envCard').style.display = '';
          document.getElementById('envOutput').value = d4.env;
          log('\n.env output ready', 'log-info');
        }

        setStatus('Build complete — send messages when ready', '#2ecc71');

      } catch (e) {
        log('ERROR: ' + e.message, 'log-err');
        setStatus('Build failed', '#e74c3c');
      }

      btn.disabled = false;
      btn.textContent = 'Build Server';
    }

    function copyEnv() {
      if (!envData) return;
      var ta = document.getElementById('envOutput');
      ta.select();
      document.execCommand('copy');
      try { navigator.clipboard.writeText(envData); } catch(e) {}
      setStatus('Copied to clipboard', '#2ecc71');
    }

    async function sendMessages() {
      if (!guildValidated) { alert('Validate the server first'); return; }

      var btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      setStatus('Sending messages...', '#e67e22');

      showLogCard();
      log('Sending all messages...', 'log-info');

      try {
        var resp = await fetch('https://architect-henna-eta.vercel.app/api/jojo-send-messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: 'jojo-send-messages-2026' })
        });

        var data = await resp.json();

        if (!resp.ok || data.error) {
          log('ERROR: ' + (data.error || resp.status), 'log-err');
          if (data.log) data.log.forEach(function(l) { log('  ' + l, 'log-err'); });
          setStatus('Send failed — did you set env vars and redeploy?', '#e74c3c');
          btn.disabled = false;
          btn.textContent = 'Send All Messages';
          return;
        }

        if (data.log) data.log.forEach(function(l) { log(l, 'log-ok'); });
        setStatus('All messages sent!', '#2ecc71');

      } catch (e) {
        log('ERROR: ' + e.message, 'log-err');
        setStatus('Send failed', '#e74c3c');
      }

      btn.disabled = false;
      btn.textContent = 'Send All Messages';
    }
  </script>
</body>
</html>
